<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sign in · Contacts Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1024'/%3E%3Cpath d='M16 3.6 6.6 7.4v7.8c0 6.1 4.2 11.4 9.4 12.9 5.2-1.5 9.4-6.8 9.4-12.9V7.4z' fill='none' stroke='%23f7c948' stroke-width='2.2'/%3E%3Cpath d='M18.4 8.6 12 18.2h3.6l-1 5.6 6.4-9.6h-3.6z' fill='%23f7c948'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth">
  <main class="shell">

    <aside class="brand" aria-hidden="true">
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.2 4 5.2v6.4c0 5 3.4 9.4 8 10.6 4.6-1.2 8-5.6 8-10.6V5.2z"/><path d="M13.3 6.4 8.8 13.3h2.8l-.9 4.6 4.5-6.9h-2.8z" fill="currentColor" stroke="none"/></svg>
        </span>
        Contacts Manager
      </div>

      <div>
        <h2>Every ally,<br><em>one signal away.</em></h2>
        <p>Summon anyone on your roster by name or email. The watchtower is always listening.</p>
      </div>
    </aside>

    <section class="panel">
      <h1>Welcome back, hero</h1>
      <p class="lede">Sign in to manage your contacts.</p>

      <form id="loginForm" novalidate onsubmit="event.preventDefault(); doLogin();">
        <div class="field">
          <label for="loginName">Username</label>
          <div class="control">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.9-4 3.8-6 7.5-6s6.6 2 7.5 6"/></svg>
            <input id="loginName" name="login" type="text" maxlength="50" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your username" required autofocus>
          </div>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="control">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input id="loginPassword" name="password" type="password" maxlength="50" autocomplete="current-password" placeholder="Your password" required>
            <button type="button" class="toggle" id="togglePw" aria-label="Show password" aria-pressed="false" onclick="
              const pw = document.getElementById('loginPassword');
              const showing = this.getAttribute('aria-pressed') === 'true';
              pw.type = showing ? 'password' : 'text';
              this.setAttribute('aria-pressed', String(!showing));
            ">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a17.6 17.6 0 0 1 4.1-4.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-2.2 3.2M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>
            </button>
          </div>
        </div>

        <div id="loginResult" class="reg-msg" role="status" aria-live="polite"></div>

        <button type="submit" class="submit" id="submitBtn">
          <span class="label">Sign in</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="alt">New to the league? <a href="register.html">Create an account</a></p>
    </section>

  </main>

  <script src="js/code.js"></script>
</body>
</html>
