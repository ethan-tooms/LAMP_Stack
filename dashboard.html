<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>My contacts · Contacts Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1024'/%3E%3Cpath d='M16 3.6 6.6 7.4v7.8c0 6.1 4.2 11.4 9.4 12.9 5.2-1.5 9.4-6.8 9.4-12.9V7.4z' fill='none' stroke='%23f7c948' stroke-width='2.2'/%3E%3Cpath d='M18.4 8.6 12 18.2h3.6l-1 5.6 6.4-9.6h-3.6z' fill='%23f7c948'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body onload="readCookie(); searchContacts();">

  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.2 4 5.2v6.4c0 5 3.4 9.4 8 10.6 4.6-1.2 8-5.6 8-10.6V5.2z"/><path d="M13.3 6.4 8.8 13.3h2.8l-.9 4.6 4.5-6.9h-2.8z" fill="currentColor" stroke="none"/></svg>
      </span>
      Contacts Manager
    </div>
    <div class="who">
      <span id="userName"></span>
      <button type="button" class="logout-btn" onclick="doLogout()">
        <i class="bi bi-box-arrow-right me-1"></i>Sign out
      </button>
    </div>
  </header>

  <main class="page">
    <div>
      <h1>My contacts</h1>
      <p class="subtitle">Search, add, edit, or remove anyone on your roster of allies.</p>
    </div>

    <section class="card">
      <h2><i class="bi bi-search me-1"></i>Search</h2>
      <div class="search-row">
        <input type="text" id="searchText" class="form-control" placeholder="Search by name or email" onkeydown="if (event.key === 'Enter') searchContacts();">
        <button type="button" class="btn btn-primary" onclick="searchContacts()">Search</button>
      </div>
      <span id="contactSearchResult" class="status-line"></span>
      <div id="contactList">
        <div class="empty-state"><i class="bi bi-hourglass-split me-1"></i>Loading your contacts…</div>
      </div>
      <div id="contactPagination" class="pagination-row mt-2"></div>
    </section>

    <section class="card">
      <h2><i class="bi bi-person-plus me-1"></i>Add a contact</h2>
      <div class="row g-2">
        <div class="col-12">
          <div class="avatar-picker mb-2">
            <div id="newContactAvatarWrap" class="avatar-wrap avatar-wrap-editable" onclick="triggerNewContactProfilePic()"></div>
            <div class="avatar-hint">Click photo<br>to add</div>
            <input type="file" id="newContactProfilePicFile" accept="image/*" style="display:none;" onchange="handleNewContactProfilePic(this)">
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <input type="text" id="contactFirstName" class="form-control mb-2" placeholder="First name">
        </div>
        <div class="col-12 col-sm-6">
          <input type="text" id="contactLastName" class="form-control mb-2" placeholder="Last name">
        </div>
        <div class="col-12 col-sm-6">
          <input type="email" id="contactEmail" class="form-control mb-2" placeholder="Email">
        </div>
        <div class="col-12 col-sm-6">
          <input type="tel" id="contactPhone" class="form-control mb-2" placeholder="Phone">
        </div>
        <div class="col-12 col-sm-6">
          <input type="text" id="contactNickname" class="form-control mb-2" placeholder="Super Alias">
        </div>
        <div class="col-12 col-sm-6">
          <input type="text" id="contactAddress" class="form-control mb-2" placeholder="Address">
        </div>
      </div>
      <button type="button" class="btn btn-primary" onclick="addContact()">
        <i class="bi bi-plus-lg me-1"></i>Add contact
      </button>
      <div id="contactAddResult" class="mt-2"></div>
    </section>
  </main>

  <script src="js/code.js"></script>
  <script>
    // Fill the Add Contact avatar with the default silhouette once code.js
    // (and its avatarImg()/DEFAULT_PROFILE_PIC) has loaded.
    document.getElementById("newContactAvatarWrap").innerHTML = avatarImg("");
  </script>
</body>
</html>
